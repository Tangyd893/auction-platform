syntax = "proto3";

package auction;

option go_package = "auction-platform/proto/gen/auction;auction";

import "google/api/annotations.proto";

// ============ 枚举定义 ============

enum ItemStatus {
  ITEM_STATUS_UNSPECIFIED = 0;
  DRAFT = 1;           // 草稿（未开始）
  LISTED = 2;           // 已上架（正在拍卖）
  SOLD = 3;            // 已售出
  UNSOLD = 4;           // 流拍
  CANCELLED = 5;        // 已取消
}

enum BidStatus {
  BID_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;          // 领先
  OUTBID = 2;          // 被超越
  WINNING = 3;         // 最终赢家
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  BUYER = 1;
  SELLER = 2;
  ADMIN = 3;
}

// ============ 通用消息 ============

message Empty {}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

// ============ 用户 ============

message User {
  int64 id = 1;
  string username = 2;
  string email = 3;
  UserRole role = 4;
  int64 created_at = 5;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  UserRole role = 4;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  User user = 2;
}

message GetUserRequest {
  int64 id = 1;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

// ============ 拍品 ============

message Item {
  int64 id = 1;
  string title = 2;
  string description = 3;
  string image_url = 4;
  int64 start_price = 5;
  int64 current_price = 6;
  int64 reserve_price = 7;
  int64 bid_increment = 8;
  int64 seller_id = 9;
  User seller = 10;
  ItemStatus status = 11;
  int64 start_time = 12;
  int64 end_time = 13;
  int64 created_at = 14;
  int64 updated_at = 15;
}

message CreateItemRequest {
  string title = 1;
  string description = 2;
  string image_url = 3;
  int64 start_price = 4;
  int64 reserve_price = 5;
  int64 bid_increment = 6;
  int64 start_time = 7;
  int64 end_time = 8;
}

message UpdateItemRequest {
  int64 id = 1;
  string title = 2;
  string description = 3;
  string image_url = 4;
  int64 reserve_price = 5;
  int64 bid_increment = 6;
  int64 end_time = 7;
}

message GetItemRequest {
  int64 id = 1;
}

message ListItemsRequest {
  ItemStatus status = 1;
  int64 seller_id = 2;
  int32 page = 3;
  int32 page_size = 4;
  string keyword = 5;
}

message ListItemsResponse {
  repeated Item items = 1;
  int32 total = 2;
}

message ListMyItemsRequest {
  int64 user_id = 1;
  ItemStatus status = 2;
}

message CancelItemRequest {
  int64 id = 1;
}

// ============ 出价 ============

message Bid {
  int64 id = 1;
  int64 item_id = 2;
  int64 buyer_id = 3;
  User buyer = 4;
  int64 amount = 5;
  BidStatus status = 6;
  int64 created_at = 7;
}

message PlaceBidRequest {
  int64 item_id = 1;
  int64 amount = 2;
}

message PlaceBidResponse {
  int64 bid_id = 1;
  int64 current_price = 2;
  bool is_winning = 3;
  string message = 4;
}

message GetBidsRequest {
  int64 item_id = 1;
}

message GetBidsResponse {
  repeated Bid bids = 1;
  int64 highest_price = 2;
  int64 highest_bidder_id = 3;
}

message GetMyBidsRequest {
  int64 user_id = 1;
}

message StreamBidsRequest {
  int64 item_id = 1;
}

message StreamBidsResponse {
  Bid bid = 1;
  int64 current_price = 2;
  int64 total_bids = 3;
}

// ============ 实时竞价（Bidirectional） ============

message BidStreamMessage {
  oneof payload {
    PlaceBidRequest bid = 1;
    StreamBidsRequest subscribe = 2;
  }
}

message BidStreamResponse {
  oneof payload {
    PlaceBidResponse bid_result = 1;
    StreamBidsResponse bid_update = 2;
    Error error = 3;
  }
}

// ============ 拍卖大厅（Server Streaming） ============

message StreamAuctionRequest {
  repeated int64 item_ids = 1;
}

message AuctionUpdate {
  int64 item_id = 1;
  string title = 2;
  int64 current_price = 3;
  int64 bid_count = 4;
  int64 end_time = 5;
  ItemStatus status = 6;
  int64 highest_bidder_id = 7;
}

// ============ 成交订单 ============

message Order {
  int64 id = 1;
  int64 item_id = 2;
  Item item = 3;
  int64 seller_id = 4;
  int64 buyer_id = 5;
  int64 final_price = 6;
  int32 status = 7;
  int64 created_at = 8;
  int64 paid_at = 9;
}

message CreateOrderRequest {
  int64 item_id = 1;
}

message GetOrderRequest {
  int64 id = 1;
}

message ListOrdersRequest {
  int64 user_id = 1;
  int32 status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int32 total = 2;
}

message UpdateOrderStatusRequest {
  int64 id = 1;
  int32 status = 2;
}

// ============ 错误 ============

message Error {
  int32 code = 1;
  string message = 2;
}

// ============ 服务定义 ============

service AuctionService {
  // 用户
  rpc Register(RegisterRequest) returns (User) {
    option (google.api.http) = {
      post: "/api/auth/register"
      body: "*"
    };
  }
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/auth/login"
      body: "*"
    };
  }
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/api/users/{id}"
    };
  }
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/api/users"
    };
  }

  // 拍品
  rpc CreateItem(CreateItemRequest) returns (Item) {
    option (google.api.http) = {
      post: "/api/items"
      body: "*"
    };
  }
  rpc UpdateItem(UpdateItemRequest) returns (Item) {
    option (google.api.http) = {
      put: "/api/items/{id}"
      body: "*"
    };
  }
  rpc GetItem(GetItemRequest) returns (Item) {
    option (google.api.http) = {
      get: "/api/items/{id}"
    };
  }
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse) {
    option (google.api.http) = {
      get: "/api/items"
    };
  }
  rpc ListMyItems(ListMyItemsRequest) returns (ListItemsResponse) {
    option (google.api.http) = {
      get: "/api/items/my"
    };
  }
  rpc CancelItem(CancelItemRequest) returns (Item) {
    option (google.api.http) = {
      delete: "/api/items/{id}"
    };
  }

  // 出价
  rpc PlaceBid(PlaceBidRequest) returns (PlaceBidResponse) {
    option (google.api.http) = {
      post: "/api/bids"
      body: "*"
    };
  }
  rpc GetBids(GetBidsRequest) returns (GetBidsResponse) {
    option (google.api.http) = {
      get: "/api/items/{item_id}/bids"
    };
  }
  rpc GetMyBids(GetMyBidsRequest) returns (GetBidsResponse) {
    option (google.api.http) = {
      get: "/api/bids/my"
    };
  }
  // Client Streaming: 批量出价
  rpc PlaceBidBatch(stream PlaceBidRequest) returns (PlaceBidResponse) {
    option (google.api.http) = {
      post: "/api/bids/batch"
      body: "*"
    };
  }
  // Server Streaming: 订阅出价更新
  rpc StreamBids(StreamBidsRequest) returns (stream StreamBidsResponse) {}

  // Bidirectional Streaming: 实时竞价窗口
  rpc BidirectionalBid(stream BidStreamMessage) returns (stream BidStreamResponse) {}

  // Server Streaming: 拍卖大厅（推送所有参与拍卖的实时价格）
  rpc StreamAuction(StreamAuctionRequest) returns (stream AuctionUpdate) {}

  // 订单
  rpc CreateOrder(CreateOrderRequest) returns (Order) {
    option (google.api.http) = {
      post: "/api/orders"
      body: "*"
    };
  }
  rpc GetOrder(GetOrderRequest) returns (Order) {
    option (google.api.http) = {
      get: "/api/orders/{id}"
    };
  }
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {
    option (google.api.http) = {
      get: "/api/orders"
    };
  }
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (Order) {
    option (google.api.http) = {
      patch: "/api/orders/{id}/status"
      body: "*"
    };
  }
}
